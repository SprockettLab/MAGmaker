# rRNA and tRNA genes in MAGs (count_rrna_trna).
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python>=3.10
  # barrnap 1.x is a rewrite (Infernal instead of HMMER, no --reject, no
  # "aligned only N percent" partial notes) that count_rrna_trna.py cannot use.
  - barrnap=0.9
  - trnascan-se>=2.0.12
