# conda-forge first, bioconda second, no defaults: the order bioconda requires.
# bioconda packages take their libraries from conda-forge. With bioconda alone,
# or first under strict channel priority (old copies of curl there pin zlib
# below what spades 4.3 needs), this environment could not be solved.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - spades>=4.3.0
  - megahit>=1.2.9
  - quast>=5.3.0
