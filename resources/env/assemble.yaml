# conda-forge first, bioconda second, no defaults: the order bioconda requires.
# bioconda packages take their libraries from conda-forge. With bioconda alone,
# or first under strict channel priority (old copies of curl there pin zlib
# below what spades 4.3 needs), this environment could not be solved.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - spades>=4.3.0
  - megahit>=1.2.9
# quast is NOT here: it needs python<3.12 for distutils, and solving it
# alongside spades and megahit landed python 3.13, where quast 5.3.0 fails at
# import. It has its own env, resources/env/quast.yaml, since the quast and
# metaquast rules were moved there.
