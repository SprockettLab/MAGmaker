# =============================================================================
# MAGmaker configuration
#
# Sections follow the order the pipeline runs:
#
#   INPUT            metadata table, read identifiers
#   WORKFLOW         which tool to use at each step
#   1  QC            fastqc -> fastp|cutadapt -> merge -> host filter -> multiqc
#   2  ASSEMBLY      megahit|metaspades -> metaquast
#   3  PROFILING     metaphlan, kraken2/bracken
#   4  PROTOTYPES    sourmash -> prototype selection
#   5  MAPPING       minimap2|bowtie2
#   6  BINNING       metabat2, maxbin2, concoct -> DAS_Tool
#   7  MAG QC        checkm2, gunc, gtdbtk
#   8  VIRAL         geNomad, checkv
#
# Stages 1-4 run from `Snakefile`; stages 5-8 from `Snakefile-bin`.
#
# Settings live in three blocks, each ordered by the same stages:
#
#   params:   per-TOOL options
#   threads:  per-RULE cpu counts
#   mem_mb:   per-RULE memory ceilings
#
# params and threads use different keys on purpose. Options belong to a tool,
# but cpus belong to a rule, and one tool can appear in several rules with
# different needs -- minimap2 has both `minimap2_index` and
# `minimap2_map_reads`. Keeping them separate preserves that.
#
# To run a real project, copy this file, edit the copy, and pass it with
#   snakemake --configfile my_project_config.yaml
# Values there override the ones here. Files named *_config.yaml,
# *_metadata.txt and *_binning.txt are gitignored, so your project settings
# stay out of the repository.
# =============================================================================


# ── INPUT ────────────────────────────────────────────────────────────────────

# One tab-separated table describing every sequencing run.
# Required columns: Sample, Sequencing_Run, R1_fp, R2_fp
# Any further columns (treatment, timepoint, subject...) are carried through
# and readable in rules via metadata_table. See docs/configuration.md.
#
# Single-end runs put the literal NA in R2_fp. Nothing is auto-detected: a
# blank R2_fp is an error, so an incomplete sheet cannot be mistaken for
# single-end data. Single-end samples are assembled by MEGAHIT only,
# because metaSPAdes rejects a single-end-only library.
metadata: resources/config/metadata.txt

# Which reads to map to; also used as a filename wildcard. The metadata
# columns read are <id>_fp, i.e. R1_fp and R2_fp.
reads:
  - R1
  - R2

# Stage 5-8 only. Generated by `generate_binning_config`; you normally point
# this at output/config/auto_binning.txt rather than editing it.
binning: resources/config/binning.txt


# ── WORKFLOW ─────────────────────────────────────────────────────────────────
# Which tool runs at each step. Lists run every entry given.

trimmer: fastp          # fastp or cutadapt

assemblers:
  - megahit             # default: faster, lower memory
# - metaspades          # better on low-complexity samples, much more RAM

biobakery:
  - metaphlan

profilers:
  - kraken2
  - bracken

mappers:
  - minimap2
# - bowtie2

# ONE seed for every tool that accepts one. Tools differ in whether they
# seed themselves: CONCOCT defaults to a fixed seed, MetaBAT2 defaults to
# the wall clock, and SemiBin2 defaults to a system-chosen seed and says
# results "may vary between runs". Setting it here once means a run is
# reproducible without remembering which tool needed telling.
#
# A per-tool key under params: overrides this, for the case where one tool
# has to be varied deliberately. The value itself carries no meaning; what
# matters is that it is fixed, and changing it changes the binning.
seed: 8675309

# All enabled binners run, then the consolidation tool (binette by
# default) combines them.
#
# SemiBin2 was added to the default set on 2026-08-15 on measured
# evidence. Total MAGs with and without it, holding everything else
# constant: Piliocolobus badius 51 -> 56 (+9.8%), Cebus imitator
# 214 -> 233 (+8.9%). Consistent across two hosts, unlike the Binette
# gain which ranged from +3% to +72%.
#
# It is also DETERMINISTIC: three replicate runs produced 155 bins every
# time. MaxBin2 by contrast is the one binner that does not reproduce
# itself -- the smoke test's phase 4 finds concoct 11/11 and metabat2
# 11/11 byte-identical across re-runs while maxbin2 differs on 2 of 11,
# including one run where it produced no bins at all for a sample.
#
# Replacing maxbin2 with semibin2, rather than adding to it, is worth
# testing: it would make the whole pipeline reproducible at no extra
# compute. That has NOT been measured and maxbin2 stays for now.
binners:
  - concoct
  - metabat2
  - maxbin2
  - semibin2


# ═════════════════════════════════════════════════════════════════════════════
# TOOL OPTIONS
# ═════════════════════════════════════════════════════════════════════════════

params:

  # ── 1  QC ──────────────────────────────────────────────────────────────────

  fastp:
    # Adapter and homopolymer removal are made EXPLICIT rather than left to
    # fastp's defaults, because those defaults are conditional:
    #
    #   --detect_adapter_for_pe
    #     For paired-end input fastp does NOT auto-detect adapter sequences;
    #     it only infers them from per-read overlap analysis, which leaves
    #     residual 3' adapter when the overlap is short or low quality.
    #     Sequence auto-detection is on by default for SE data only.
    #
    #   --adapter_fasta
    #     Belt-and-braces: trims the known TruSeq/Nextera sequences even
    #     when overlap analysis and detection both miss them.
    #
    #   --trim_poly_g
    #     fastp enables polyG trimming only when it recognises a NextSeq or
    #     NovaSeq instrument ID in the read header. For SRA re-exports that
    #     is not something you can rely on. Deflines differ across datasets:
    #
    #       @SRR36840144.1 A00814:609:HMHW7DSX3:1:1101:10004:4726 length=151
    #       @SRR36840144.1 1 length=151
    #       @A00814:715:HVFYYDRX2:1:1101:18114:1016 1:N:0:...   (native)
    #
    #     Some SRA runs carry the original Illumina name, some do not, and
    #     even when present it is not in the leading field where native
    #     output puts it. Detection is therefore unreliable for archived
    #     data. Forcing the flag removes the dependency entirely.
    #
    #   --trim_poly_x
    #     Catches polyA read-through (and other homopolymer tails), which
    #     the adapter panel cannot cover. Matters for RNA-derived libraries
    #     and is harmless for DNA.
    #
    # Set to "" to restore fastp's stock behaviour.
    extra: "--detect_adapter_for_pe --adapter_fasta resources/adapters/illumina_adapters.fa --trim_poly_g --trim_poly_x"

    # Single-end samples (R2_fp = NA in the metadata table) use `extra`
    # with --detect_adapter_for_pe removed, since that flag applies only to
    # paired input and fastp already detects adapter sequence for
    # single-end reads by default. Set extra_se here to override that
    # derived value with something explicit.
    # extra_se: "--adapter_fasta resources/adapters/illumina_adapters.fa --trim_poly_g --trim_poly_x"

  cutadapt:
    # Alternative to fastp; selected with `trimmer: cutadapt` above.
    # NOTE these are TruSeq sequences. For Nextera/tagmentation libraries
    # use -a CTGTCTCTTATACACATCT -A CTGTCTCTTATACACATCT instead.
    adapter: '-a GATCGGAAGAGC -a GGGGGGGGGGGGGGGGGGGG -A GATCGGAAGAGC -A GGGGGGGGGGGGGGGGGGGG'
    other: "-u 10 -U 10 --minimum-length 1 --nextseq-trim 20"

  bowtie2:
    # Used for host filtering here; see `mappers` for read mapping.
    bt2_command: 'bowtie2'
    bt2b_command: 'bowtie2-build'
    extra: '--very-fast'

  multiqc: ''

  # ── 2  ASSEMBLY ────────────────────────────────────────────────────────────

  metaquast:
    reference_dir: "resources/db/metaquast/"
    extra: ''

  # ── 3  PROFILING ───────────────────────────────────────────────────────────

  metaphlan:
    db_path: "/isilon/datalake/sprockett_lab/original/WF00SprockettLab/dbs/metaphlan"
    db_name: "mpa_vJan25_CHOCOPhlAnSGB_202503"
    other: "--add_viruses --unclassified_estimation"

  kraken2:
    levels: 'P,C,O,F,G,S'
    db: '/isilon/datalake/sprockett_lab/original/WF00SprockettLab/dbs/kraken2/Kraken2_db_Standard'
    # Bracken's .kmer_distrib must come from the SAME build as the kraken db;
    # mixing them silently produces wrong abundances.
    bracken-db: '/isilon/datalake/sprockett_lab/original/WF00SprockettLab/dbs/kraken2/Kraken2_db_Standard'

  # ── 4  PROTOTYPE SELECTION ─────────────────────────────────────────────────

  sourmash:
    k: 31
    scaled: 1000
    extra: ''

  prototypes:
    # Depth bounds on which samples may serve as prototypes. Both are
    # compared against fastp's total_reads, which counts BOTH mates -- so a
    # "50M read" library is 100M by this measure, and the ceiling bites at
    # half the depth you might expect.
    #
    # max_seqs excludes the DEEPEST samples, which are the ones that make
    # the best differential-coverage basis for binning. The old 100000000
    # default silently dropped the top 4% of a 341-sample gut cohort
    # (deepest run 138.5M reads). Sketching is cheap, so the ceiling is set
    # high enough to keep everything and exists only as a guard against a
    # pathological input.
    min_seqs: 50          # recommended for real data: 10000000
    max_seqs: 200000000
    n: 10                 # representative samples selected for binning

    # Samples that must never serve as a prototype, by sample name. A run
    # control belongs here: it should still be trimmed, screened and
    # profiled so its content is known, but it is not part of the biology
    # and has no business forming a differential-coverage basis for
    # binning. Depth bounds cannot express this, since a control can be
    # sequenced as deeply as anything else.
    #
    # A name here that matches no sample stops the run rather than being
    # ignored, so a typo cannot silently leave a control in the pool.
    exclude: []

  # ── 5  MAPPING ─────────────────────────────────────────────────────────────

  minimap2:
    x: 'sr'
    k: 500000000

  # ── 6  BINNING ─────────────────────────────────────────────────────────────

  metabat2:
    extra: '--verbose'
    min_contig_length: 1500   # should be >= 1500
    # MetaBAT2's own default is 0, which its source replaces with time(0),
    # so unseeded runs are not expected to agree. The value comes from the
    # top-level `seed:`; uncomment to override for this tool alone.
    # seed: 8675309
  maxbin2:
    prob_threshold: 0.8
    extra: ''
    min_contig_length: 1500

  # SemiBin2, an optional fourth binner. Add 'semibin2' to the `binners`
  # list above to enable it; it is not run by default.
  semibin2:
    # SemiBin2 documents --random-seed as reproducing results across runs;
    # its default is a system-chosen seed with results that "may vary
    # between runs". The value comes from the top-level `seed:`; uncomment
    # to override for this tool alone.
    # random_seed: 8675309
    # cpu rather than auto. There is no GPU here, and GPU kernels are a
    # common source of run-to-run variation even when seeded.
    engine: cpu
    min_contig_length: 1000
    # Empty means the model is trained from this sample (--self-supervised).
    # Setting it to one of human_gut/dog_gut/ocean/soil/cat_gut/human_oral/
    # mouse_gut/pig_gut/built_environment/wastewater/chicken_caecum/global
    # uses a pretrained model instead, which is faster and removes the
    # training step entirely -- but asserting that a wild primate gut
    # resembles one of those is a claim about the biology rather than a
    # tuning choice, so it is left to the user.
    environment: ''
    extra: ''
  concoct:
    chunk_size: 10000
    overlap_size: 0
    min_contig_length: 1500
  # Strain heterogeneity, the fraction of positions in a MAG carrying more
  # than one allele when the sample's own reads are mapped back to it.
  # CheckM2 sees material from another species and GUNC sees chimerism
  # against a reference; neither sees a MAG that is a clean consensus of
  # several co-resident strains of one species.
  #
  # These values match Pasolli 2019 and Sanders 2023 so the numbers are
  # comparable with the published genome databases. Changing them makes
  # that comparison invalid.
  cmseq:
    mincov: 10              # minimum depth for a position to be evaluated
    minqual: 30             # minimum base quality
    dominant_frq_thrsh: 0.8
    min_positions: 100      # fewer evaluated positions than this reports NA
    # Read filters applied before poly.py sees the alignment. Every read in
    # the sample is mapped to that sample's own MAGs, so reads from species
    # that were never binned land on the nearest available reference and are
    # counted as polymorphism. Measured across five arms without these
    # filters, strain heterogeneity ranked exactly inversely to how well
    # each arm's MAGs were covered.
    #
    # min_mapq removes reads that map about as well to another of this
    # sample's MAGs. min_read_identity removes reads from relatives that
    # have no MAG of their own: those map uniquely, so MAPQ cannot catch
    # them, but divergently. Within-species strain variation is above 95%
    # identity by definition, so filtering there keeps the signal.
    min_mapq: 20
    min_read_identity: 0.95

  das_tool:
    search_engine: 'diamond'
    # DAS_Tool keeps a bin only if its score clears this. The score combines
    # single-copy-marker completeness and purity, so raising it keeps fewer,
    # cleaner bins and lowering it keeps more, at some risk of admitting
    # poorer ones.
    #
    # 0.5 is DAS_Tool's own default and is deliberately conservative: a bin
    # that only one binner resolves is discarded even when it is a real
    # organism absent from every kept bin. Comparing this pipeline's output
    # against a published single-binner set on identical reads, every one of
    # the 70 genomes the other study recovered and this one did not was
    # present among these bins and dropped here, so the setting is worth
    # knowing about and worth being able to change.
    #
    # Lower it only with the quality of the whole MAG set in view: the
    # genomes it admits are worth having only if GUNC pass rate and
    # contamination hold up.
    score_threshold: 0.5

  # Which tool reconciles the three per-binner bin sets into one set of MAGs.
  #
  #   das_tool  scores candidates with 51 bacterial single-copy genes and a
  #             redundancy heuristic. The historical default.
  #   binette   scores them with CheckM2 -- the same estimator that judges
  #             the result in mag_qc -- and builds extra candidates from the
  #             intersection, difference and union of overlapping bins.
  #
  # Binette is the default, on measured evidence. Across four arms holding
  # reads, assembly, mapping and all three binners constant, and giving
  # both tools identical scaffolds2bin tables: 888 usable genomes under
  # DAS_Tool against 1320 under Binette, +49%. Of 51 bins DAS_Tool
  # selected and Binette did not, ZERO were usable. DAS_Tool also does not
  # reproduce itself, returning 46, 38 and 33 bins on three identical
  # runs, which is more variation than any parameter produces.
  #
  # DAS_Tool remains fully supported and selectable. It is wired in
  # correctly and people use it.
  #
  # Override for one run without editing this file:
  #   ./run_magmaker.sh --das-tool
  #   ./run_magmaker.sh --binette
  consolidation:
    tool: binette

  binette:
    # Bins are scored as `completeness - contamination_weight * contamination`.
    # At 2 a percentage point of contamination costs two points of
    # completeness, so a cleaner genome beats a more complete one. That is
    # the right direction for phylogenomics, where an incomplete genome
    # contributes missing data that maximum likelihood tolerates while a
    # contaminated one contributes markers from two lineages and is placed
    # confidently in the wrong position. Lower it to favour completeness.
    contamination_weight: 2.0
    # These four bound both intermediate bin creation and final selection.
    # They are Binette's own defaults and, unlike a DAS_Tool score, they are
    # in units that mean something: CheckM2 percentages and base pairs.
    #
    # Note min_completeness 40 sits below MIMAG medium quality (50) and
    # max_contamination 10 above the stricter <5% wanted for tree building.
    # That is deliberate here: mag_summary records every MAG with its tier,
    # and the analysis filters afterwards. Tightening these discards genomes
    # before they can be counted.
    min_completeness: 40
    max_contamination: 10
    min_length: 200000       # bp; excludes fragments too small to be a genome
    max_length: 10000000     # bp
    extra: ''

  # ── 7  MAG QC ──────────────────────────────────────────────────────────────

  checkm2:
    db_path: "/isilon/datalake/sprockett_lab/original/WF00SprockettLab/dbs/checkm2/CheckM2_database/uniref100.KO.1.dmnd"  # "" to auto-download
  gunc:
    db_path: "/isilon/datalake/sprockett_lab/original/WF00SprockettLab/dbs/gunc/gunc_db_progenomes2.1.dmnd"  # "" to auto-download
  gtdbtk:
    db_path: "/isilon/datalake/sprockett_lab/original/WF00SprockettLab/dbs/gtdbtk/release232"  # "" and see docs/databases.md
    # `align` drops genomes below this into filtered.tsv rather than
    # reporting a low value for them. Two values because the two modes want
    # different things.
    #
    # min_perc_aa applies when classify will follow. 10 is GTDB-Tk's own
    # default and placing a genome that fills almost none of the alignment
    # is not worth pplacer's time.
    #
    # min_perc_aa_no_classify applies under --skip-gtdbtk-classify, where
    # the whole point is to have MSA_Percent for every genome. A genome
    # missing from the output is not the same as one measured at 4%, so 0
    # keeps them all and lets the analysis pick its own floor. Note this
    # means an align-only run followed later by classify will place genomes
    # a plain classify_wf run would have filtered; GTDB-Tk flags those in
    # its warnings column, which mag_summary carries as GTDBTk_Warnings.
    min_perc_aa: 10
    min_perc_aa_no_classify: 0

  # ── 8  VIRAL / PLASMID ─────────────────────────────────────────────────────

  genomad:
    db_path: "/isilon/datalake/sprockett_lab/original/WF00SprockettLab/dbs/genomad/genomad_db"  # genomad download-database <dir>
    extra: ''             # e.g. '--conservative' for higher-precision calls
  checkv:
    db_path: "/isilon/datalake/sprockett_lab/original/WF00SprockettLab/dbs/checkv/checkv-db-v1.5"  # checkv download_database <dir>


# ═════════════════════════════════════════════════════════════════════════════
# HOST FILTER
# ═════════════════════════════════════════════════════════════════════════════
# Stage 1. The index stem is the FASTA filename with its extension removed,
# so genome=/path/human.fna expects /path/human.*.bt2 in db_dir.
#
# A complete existing index is detected and reused; the index is only built
# when one is absent or incomplete. Nothing needs to be touched by hand.
#
# Pre-built indexes on demon (/isilon/datalake/sprockett_lab/original/WF00SprockettLab/dbs/bt2/):
#   human_GCA_000001405.29_GRCh38.p14/GCA_000001405.29_GRCh38.p14_genomic.fna
#
# For test runs (mouse chr1):
#   db_dir: resources/test/test_dbs
#   genome: resources/test/test_dbs/GCA_000001635.9.fna

host_filter:
  db_dir: "/isilon/datalake/sprockett_lab/original/WF00SprockettLab/dbs/bt2/human_GCA_000001405.29_GRCh38.p14"
  genome: "/isilon/datalake/sprockett_lab/original/WF00SprockettLab/dbs/bt2/human_GCA_000001405.29_GRCh38.p14/GCA_000001405.29_GRCh38.p14_genomic.fna"


# ═════════════════════════════════════════════════════════════════════════════
# THREADS  (per RULE, ordered by stage)
# ═════════════════════════════════════════════════════════════════════════════

threads:
  # 1  QC
  fastqc: 1
  fastp: 8
  cutadapt_pe: 4
  host_filter: 8
  bowtie2_build: 8
  # 2  assembly
  megahit: 16
  spades: 8
  metaquast: 8
  # 3  profiling
  metaphlan: 8
  kraken2: 4
  # 5  mapping
  minimap2_index: 8
  minimap2_map_reads: 8
  map_reads: 8
  sort_bam: 8
  # 6  binning
  run_metabat2: 8
  run_maxbin2: 8
  run_concoct: 8
  run_semibin2: 16
  concoct: 8
  run_DAS_Tool: 8
  run_binette: 16
  cmseq: 8
  # 7  MAG QC
  checkm2: 16
  gunc: 8
  gtdbtk: 16
  # 8  viral
  genomad: 16
  checkv: 8


# ═════════════════════════════════════════════════════════════════════════════
# MEMORY  (MB, per RULE; only rules needing more than the profile default)
# ═════════════════════════════════════════════════════════════════════════════
# Assembly rules auto-scale their request with input size
# (max(16000, input_mb x 10)) up to the ceiling set here. Other rules use the
# value directly.

mem_mb:
  megahit: 256000
  spades: 256000
  multiqc: 32000
  checkm2: 32000
  # GTDB-Tk's memory is dominated by pplacer during classify_wf, which loads
  # the reference package into RAM. Requirements vary a lot with the number
  # of bins: on a 341-sample gut cohort, 324 samples finished inside 128 GB
  # while 17 were OOM-killed, one of them logging three kill events.
  #
  # A flat request sized for the worst case is the wrong fix -- mem_mb is a
  # SLURM reservation, so requesting 300 GB for every sample confines all of
  # them to the handful of nodes that large and serialises the stage. Instead
  # `gtdbtk` is the FIRST attempt and `gtdbtk_max` the ceiling: the rule
  # requests gtdbtk * attempt, capped, so most samples schedule anywhere and
  # only the heavy ones wait for a big node. Retries come from
  # retries.run_gtdbtk below.
  #
  # If no node can supply the ceiling, pass --scratch_dir to gtdbtk instead:
  # pplacer then mmaps the reference to disk, needing far less RAM but
  # running slower.
  gtdbtk: 128000        # first attempt
  gtdbtk_max: 320000    # ceiling on retry (2nd attempt asks 256000)
  # Used instead of the two above when --skip-gtdbtk-classify is given.
  # Everything above is sized for pplacer, which that flag does not run;
  # identify and align are gene calling, an HMM search and an alignment.
  # This is the whole point of the flag: 128-320 GB confines the rule to
  # the largest nodes and serialises it, and without classify none of that
  # is needed.
  gtdbtk_align: 32000
  gtdbtk_align_max: 64000
  #
  # The rules below use the same escalate-on-retry scheme (mem_escalate in
  # common.smk): the value here is the FIRST attempt, <key>_max is the
  # ceiling, and each retry doubles. Absent a _max the cap is 4x the base.
  # Only rules with evidence of pressure are listed; everything else takes
  # the profile default.
  # Values chosen from measured peak RSS on a 341-sample gut cohort, not
  # from guesswork -- three rules that looked at risk structurally measured
  # under 10% of the default and are deliberately left alone.
  map_reads_minimap2: 12000     # measured 7972 MB against the 8000 default
  # Binette holds every candidate bin's contigs and CheckM2 feature vectors
  # in memory at once, and the set operations multiply the candidate count
  # well past the number of input bins. Escalates on retry like gtdbtk
  # rather than reserving the worst case for every sample.
  run_binette: 64000
  run_binette_max: 192000
  # SemiBin2 holds contig features and a PyTorch model in memory.
  run_semibin2: 32000
  run_semibin2_max: 96000
  metaphlan: 32000              # measured 29688 MB against 32000
  sort_index_bam: 12000         # measured 6831 MB against the 8000 default


# ═════════════════════════════════════════════════════════════════════════════
# RETRIES
# ═════════════════════════════════════════════════════════════════════════════
# DAS_Tool's single-copy-gene detection intermittently comes up empty under
# high per-node concurrency: it reports no SCGs for BOTH the bacteria and
# archaea sets and aborts ("No single copy genes predicted"). This is a known,
# unresolved fragility in DAS_Tool's own parallel plumbing, not the data --
# see cmks/DAS_Tool#110 (empty .scg.candidates.faa despite successful gene
# prediction and DIAMOND hits), #57 (threads arg not respected), #78 (fails on
# some samples, evaluateBinsDTParallel). gunc's DIAMOND step is similarly
# fragile. Here it is nondeterministic -- the same sample succeeds on a re-run
# -- so retrying clears it, because a retry fires as the batch drains and lands
# in a lower-contention window.

retries:
  run_DAS_Tool: 4
  run_binette: 2
  run_semibin2: 2
  run_gunc: 4
  run_checkm2: 3
  # Escalates memory rather than just re-trying: run_gtdbtk requests
  # mem_mb.gtdbtk * attempt, capped at mem_mb.gtdbtk_max. Two retries reach
  # the ceiling, which is enough for every sample seen so far.
  run_gtdbtk: 2
  # consolidate_DAS_Tool_bins reads run_DAS_Tool's output; on a busy shared
  # filesystem that input can lag past latency-wait. A few retries ride it out.
  consolidate_DAS_Tool_bins: 3
