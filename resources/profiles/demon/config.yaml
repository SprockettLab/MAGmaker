executor: slurm

default-resources:
  slurm_partition: defq
  mem_mb: 8000
  runtime: 120        # minutes; defq default is 120, max is 90 days

jobs: 100

# Caps concurrent kraken2 jobs within one workflow. kraken2 reads a ~200 GB
# index per job, so a dozen at once saturate shared storage and jobs are
# cancelled on wall clock having done almost no classification. This is a
# per-workflow counter: several arms running side by side each get their
# own allowance, so stagger arms as well when the queue is busy.
resources:
  - kraken_slots=2
use-conda: true
conda-prefix: /isilon/datalake/sprockett_lab/original/WF00SprockettLab/envs/snakemake_envs

set-resources:
  # fastp reads every raw FASTQ, so it is the rule most exposed to slow
  # shared storage. At the 120 min default it was cancelled on a 2.4 GB
  # saliva library while ~200 jobs were hammering isilon -- 116 min elapsed,
  # four minutes inside the limit. The work itself is minutes; the variance
  # is I/O contention, and an explicit adapter panel adds per-read matching
  # on top. Give it room rather than lose a whole run to one timeout at 98%.
  fastp:
    runtime: 360
  host_filter:
    mem_mb: 16000
    runtime: 480
  # Indexing a 3 Gbp primate reference takes hours, and this rule had no
  # entry at all, so it inherited the 120 min default and was cancelled
  # mid-build for both Papio cynocephalus and Pan paniscus. It only ever
  # passed before because the references in use were already indexed; every
  # new host species would have hit this.
  host_bowtie2_build:
    runtime: 1440
  # Normally minutes, but not on uncompressed input: the MG-RAST douc
  # libraries are ~40 GB each as plain FASTQ rather than the .gz everything
  # else uses, and at 120 min all four were cancelled around 70% read.
  fastqc_pre_trim:
    runtime: 360
  fastqc_post_trim:
    runtime: 360
  fastqc_post_host:
    runtime: 360
  megahit:
    runtime: 480
  metaspades:
    mem_mb: 256000      # metaSPAdes OOMs at the assemble rule's ~16 GB
                        # input-scaled floor; this overrides it. defq nodes
                        # are ~755 GB, so 256 GB still fits 3 jobs per node.
    runtime: 1440       # metaspades is much slower than megahit
  metaphlan:
    mem_mb: 32000
    runtime: 480        # 240 was hit exactly, on a deep single-end sample
  taxonomy_kraken:
    mem_mb: 220000
    runtime: 480        # same, on the same arm
  # Sorting the BAMs from a large arm is not a two-minute job: a 20-sample
  # cohort produces a 614 GB mapping directory, and samtools writes its
  # temp chunks to shared storage. At the 120 min default this rule was
  # cancelled repeatedly on the biggest arms. Only runtime is set here;
  # memory comes from mem_escalate in the rule and must not be overridden.
  sort_index_bam:
    runtime: 480
  # One alignment of a sample's reads against its own MAGs. Comparable to a
  # single column of the all-vs-all mapping, and cannot reuse it: those
  # BAMs are temp() and the all-vs-all maps prototype reads to each
  # sample's contigs, never a non-prototype sample's reads to its own.
  cmseq_map:
    runtime: 480
  # poly.py is a single-threaded Python pileup over the whole BAM, and
  # those BAMs are large: a 2-sample douc arm produced a 7.9 GB one, which
  # the 120 min default cancelled outright. This is the slowest step CMSeq
  # adds and the one that decides whether it is affordable at all.
  cmseq_poly:
    runtime: 1440
  # Building the reference is cat over a sample's MAGs, and the aggregation
  # reads one small table, but both inherited the 120 min default and there
  # is no reason for either to be the thing that stops an arm.
  cmseq_reference:
    runtime: 240
  cmseq_aggregate:
    runtime: 240
  # Memory for these two comes from config['mem_mb'] (read by the rules),
  # so set only runtime here to avoid overriding the config-driven mem.
  run_checkm2:
    runtime: 360        # DIAMOND vs uniref100; usually well under this
  run_gtdbtk:
    runtime: 1440       # classify_wf (pplacer + ANI) can run several hours
                        # memory comes from config['mem_mb']['gtdbtk'];
                        # 128 GB OOM-killed 17/341 samples, raised to 300 GB
  make_concoct_coverage_table:
    mem_mb: 64000       # ~7.8 GiB at the 8 GB cap on a 90-BAM reference
    runtime: 720        # concoct_coverage_table.py over ~90 BAMs > 2 h default
  make_metabat2_coverage_table:
    mem_mb: 64000       # jgi_summarize_bam_contig_depths holds every contig's
                        # depth in memory across all BAMs -- it prints "all
                        # depths will be in memory" and offers --checkpoint as
                        # the alternative. At the 8 GB default it was OOM-killed
                        # partway through the BAM list on an 89-sample vervet
                        # cohort (180,875 contigs x 14 BAMs), dying silently
                        # mid-read with no error line, which makes the cause
                        # hard to see. Matches its concoct counterpart above.
    runtime: 720
  run_DAS_Tool:
    mem_mb: 32000       # DIAMOND SCG search OOMs at the 8 GB default (bacteria
    runtime: 240        # set fails, archaea survives); matches run_checkm2's
                        # DIAMOND allocation, the one that works
  run_gunc:
    mem_mb: 32000       # DIAMOND vs progenomes2.1 OOMs at the 8 GB default
    runtime: 240
  run_genomad:
    mem_mb: 32000       # marker DB search (MMseqs2/aragorn) over all contigs
    runtime: 480
  run_checkv:
    mem_mb: 16000       # DIAMOND/HMMER over just the viral contig subset
    runtime: 240
latency-wait: 300      # isilon can lag well past 60s when a full run's outputs
                       # land at once; 60 caused spurious MissingOutput failures
                       # on make_mag_summary and consolidate_DAS_Tool_bins
rerun-incomplete: true
keep-going: true
printshellcmds: true
