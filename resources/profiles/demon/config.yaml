executor: slurm

default-resources:
  slurm_partition: defq
  mem_mb: 8000
  runtime: 120        # minutes; defq default is 120, max is 90 days

jobs: 100
use-conda: true
conda-prefix: /isilon/datalake/sprockett_lab/original/WF00SprockettLab/envs/snakemake_envs

set-resources:
  host_filter:
    mem_mb: 16000
    runtime: 480
  megahit:
    runtime: 480
  metaspades:
    runtime: 1440       # metaspades is much slower than megahit
  metaphlan:
    mem_mb: 32000
    runtime: 240
  taxonomy_kraken:
    mem_mb: 220000
    runtime: 240
  # Memory for these two comes from config['mem_mb'] (read by the rules),
  # so set only runtime here to avoid overriding the config-driven mem.
  run_checkm2:
    runtime: 360        # DIAMOND vs uniref100; usually well under this
  run_gtdbtk:
    runtime: 1440       # classify_wf (pplacer + ANI) can run several hours
  make_concoct_coverage_table:
    mem_mb: 64000       # ~7.8 GiB at the 8 GB cap on a 90-BAM reference
    runtime: 720        # concoct_coverage_table.py over ~90 BAMs > 2 h default
latency-wait: 60
rerun-incomplete: true
keep-going: true
printshellcmds: true
