executor: slurm

default-resources:
  slurm_partition: defq
  mem_mb: 8000
  runtime: 120        # minutes; defq default is 120, max is 90 days

jobs: 100
use-conda: true
conda-prefix: /isilon/datalake/sprockett_lab/original/WF00SprockettLab/envs/snakemake_envs

set-resources:
  # fastp reads every raw FASTQ, so it is the rule most exposed to slow
  # shared storage. At the 120 min default it was cancelled on a 2.4 GB
  # saliva library while ~200 jobs were hammering isilon -- 116 min elapsed,
  # four minutes inside the limit. The work itself is minutes; the variance
  # is I/O contention, and an explicit adapter panel adds per-read matching
  # on top. Give it room rather than lose a whole run to one timeout at 98%.
  fastp:
    runtime: 360
  host_filter:
    mem_mb: 16000
    runtime: 480
  megahit:
    runtime: 480
  metaspades:
    mem_mb: 256000      # metaSPAdes OOMs at the assemble rule's ~16 GB
                        # input-scaled floor; this overrides it. defq nodes
                        # are ~755 GB, so 256 GB still fits 3 jobs per node.
    runtime: 1440       # metaspades is much slower than megahit
  metaphlan:
    mem_mb: 32000
    runtime: 240
  taxonomy_kraken:
    mem_mb: 220000
    runtime: 240
  # Memory for these two comes from config['mem_mb'] (read by the rules),
  # so set only runtime here to avoid overriding the config-driven mem.
  run_checkm2:
    runtime: 360        # DIAMOND vs uniref100; usually well under this
  run_gtdbtk:
    runtime: 1440       # classify_wf (pplacer + ANI) can run several hours
                        # memory comes from config['mem_mb']['gtdbtk'];
                        # 128 GB OOM-killed 17/341 samples, raised to 300 GB
  make_concoct_coverage_table:
    mem_mb: 64000       # ~7.8 GiB at the 8 GB cap on a 90-BAM reference
    runtime: 720        # concoct_coverage_table.py over ~90 BAMs > 2 h default
  run_DAS_Tool:
    mem_mb: 32000       # DIAMOND SCG search OOMs at the 8 GB default (bacteria
    runtime: 240        # set fails, archaea survives); matches run_checkm2's
                        # DIAMOND allocation, the one that works
  run_gunc:
    mem_mb: 32000       # DIAMOND vs progenomes2.1 OOMs at the 8 GB default
    runtime: 240
  run_genomad:
    mem_mb: 32000       # marker DB search (MMseqs2/aragorn) over all contigs
    runtime: 480
  run_checkv:
    mem_mb: 16000       # DIAMOND/HMMER over just the viral contig subset
    runtime: 240
latency-wait: 300      # isilon can lag well past 60s when a full run's outputs
                       # land at once; 60 caused spurious MissingOutput failures
                       # on make_mag_summary and consolidate_DAS_Tool_bins
rerun-incomplete: true
keep-going: true
printshellcmds: true
